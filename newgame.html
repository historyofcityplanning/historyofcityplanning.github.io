<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game Mode</title>
    <link rel="icon" href="images/favicon.png" type="image/png">
    <link rel="stylesheet" href="newgamestyle.css">
</head>
<body>
    <header>
        <a href="https://historyofcityplanning.site/" target="_blank">History Of City Planning</a>
        <p>Game Mode</p>
    </header>

    <div class="scoreboard">
        <div class="score">Score:0</div>
        <div class="lives">Lives: 5</div>
    </div>

    <div class="instructions-container">
        <div class="instructions">
            <h3>How To Play</h3>
            <p>Arrange the Cities from the Oldest to the Newest</p>
        </div>
    </div>

    <div class="game-container">
        <div id="card-zone">
            <div id="active-card" class="card-row"></div>
            <div class="drop-row-container">
                <div id="drop-zones-inner" class="drop-row-inner"></div>
            </div>
        </div>

        <div id="overlay" class="overlay"></div>

        <div id="gameoverboard" class="gameoverboard">
            <h1>Game Over !</h1>
            <h2 id="final-score" class="smallscore">Score: 0</h2>
            <h3 id="position" class="position">Try Again</h3>
            <button onclick="restartGame()">Play Again !</button>
        </div>
    </div>

    <script src="cities-data.js"></script>
    <script src="newgame.js"></script>
</body>
</html>
